name: Deploy research platform
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: semya-pages
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install data-refresh dependencies
        run: python -m pip install -r scripts/requirements-refresh.txt
      - name: Test Python calculations and parser contracts
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Recompute monthly fertility forecasts
        run: python scripts/build_indicator_forecasts.py
      - name: Bootstrap observed age inputs and compute projections
        run: python scripts/refresh_demography.py --fetch
      - name: Cache official author portraits when available
        run: python scripts/cache_author_images.py
      - name: Report external-source availability
        run: python scripts/update_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Test local data and arithmetic
        run: npm test
      - name: Build self-contained site
        run: npm run build && npm run validate
      - name: Preserve validated bootstrap inputs and results for the next run
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/projections public/data/authors.json public/data/author_images_status.json inputs/upstream
          if [ -d public/assets/authors ]; then git add public/assets/authors; fi
          if [ -d public/downloads/demography/upstream ]; then git add public/downloads/demography/upstream; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: validated projection bootstrap'
            git fetch origin "$DEFAULT_BRANCH"
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/"$DEFAULT_BRANCH")" ]; then
              echo 'Default branch changed while computing. Rerun on the new revision.' >&2
              exit 1
            fi
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
