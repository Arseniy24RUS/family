name: Publish analytics indexing fix
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-seo-hotfix.yml

permissions: {}
concurrency:
  group: semya-pages
  cancel-in-progress: false

jobs:
  patch-validated-package:
    if: github.repository == 'Arseniy24RUS/family' && github.event.before == 'b9b12a370789d52574ecad8384ecf69260994e16'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Replace only the verified analytics script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$GITHUB_SHA" = "$current_main"
          previous=b9b12a370789d52574ecad8384ecf69260994e16
          changes=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" --jq '.files[].filename' | sort)
          expected=$(printf '%s\n' .github/workflows/deploy.yml .github/workflows/publish-seo-hotfix.yml public/metrika.js)
          test "$changes" = "$expected"
          printf '%s  %s\n' '9f11c5be99df77de9e97b6c8ab540474f7fa81546e3710f95801841501e64bfc' public/metrika.js | sha256sum -c -
          node --check public/metrika.js
          bundle="$RUNNER_TEMP/published-pages.zip"
          archive="$RUNNER_TEMP/artifact.tar"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13663604726/zip" > "$bundle"
          printf '%s  %s\n' '45e6f9fdc2bcd68738398d6d8bebae50cf327bf8274e5fc7fa17060a6426031b' "$bundle" | sha256sum -c -
          test "$(unzip -Z1 "$bundle")" = 'artifact.tar'
          unzip -p "$bundle" artifact.tar > "$archive"
          tar -xOf "$archive" ./index.html > "$RUNNER_TEMP/published-index.html"
          grep -Fq 'data-counter="114141850"' "$RUNNER_TEMP/published-index.html"
          tar -xOf "$archive" ./metrika.js > "$RUNNER_TEMP/published-metrika.js"
          printf '%s  %s\n' 'a57670616849bd492af9b1b67343898e77ec50df3ecdbb044e5bbb22f72a95d1' "$RUNNER_TEMP/published-metrika.js" | sha256sum -c -
          tar -tf "$archive" | sort > "$RUNNER_TEMP/pages-before.txt"
          tar --delete -f "$archive" ./metrika.js
          tar -C public -rf "$archive" ./metrika.js
          tar -tf "$archive" | sort > "$RUNNER_TEMP/pages-after.txt"
          diff -u "$RUNNER_TEMP/pages-before.txt" "$RUNNER_TEMP/pages-after.txt"
          tar -xOf "$archive" ./metrika.js | cmp - public/metrika.js
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: patch-validated-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish analytics indexing fix
        id: publish
        uses: actions/deploy-pages@v4
